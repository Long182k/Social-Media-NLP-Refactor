apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smnlp-local
resources:
  - namespace.yaml
  - ../../base
images:
  - name: social-media-nlp-api
    newTag: m4-local
configMapGenerator:
  - name: social-media-api
    literals:
      - APP_ORIGIN=http://social-media.localhost
      - PUBLIC_BASE_URL=http://social-media.localhost
      - APP_ENV=development
      - COOKIE_SECURE=false
