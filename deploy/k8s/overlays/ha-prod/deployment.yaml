apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-media-api
spec:
  replicas: 3
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: social-media-api
                topologyKey: kubernetes.io/hostname
