services:
  - type: web
    name: social-media-nlp-demo
    runtime: docker
    plan: free
    autoDeployTrigger: "off"
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: VALKEY_URL
        sync: false
      - key: MAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_OWNER_EMAIL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: ENABLE_CLOUD_NLP
        value: "false"
